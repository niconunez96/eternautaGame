name: Playtests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  godot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Godot QA smoke playtest
        uses: youichi-uda/godot-qa@v1.0.1
        with:
          project-path: .
          godot-version: '4.6.0'
          scenario: res://tests/qa/smoke.json
          report: qa-report.json
          junit: qa-report.xml
